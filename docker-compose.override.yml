# docker-compose.override.yml
services:
  sqldata:
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${SQL_SA_PASSWORD}
    ports:
      - "5433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  journal-api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__LocalSqlConnection=Server=sqldata;Database=JournalProject;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True
      - ApiKey=${API_KEY}
    ports:
      - "5101:8080"

  journal-web:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - JournalApiUrl=http://journal-api:8080/
    ports:
      - "5102:8080"